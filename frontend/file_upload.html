<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Upload Incident Data</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "secondary-fixed": "#ffe16d",
          "primary": "#000f76",
          "surface-variant": "#e1e2e6",
          "secondary": "#705d00",
          "inverse-primary": "#bcc2ff",
          "on-tertiary-fixed": "#191c1f",
          "surface": "#f8f9fd",
          "primary-container": "#001cb0",
          "on-surface": "#191c1f",
          "inverse-surface": "#2e3134",
          "on-primary": "#ffffff",
          "tertiary": "#202326",
          "primary-fixed-dim": "#bcc2ff",
          "background": "#f8f9fd",
          "on-background": "#191c1f",
          "surface-container-lowest": "#ffffff",
          "error": "#ba1a1a",
          "on-tertiary-container": "#9fa1a5",
          "on-primary-container": "#8d9aff",
          "primary-fixed": "#dfe0ff",
          "on-tertiary": "#ffffff",
          "on-surface-variant": "#454654",
          "on-error": "#ffffff",
          "tertiary-fixed": "#e1e2e6",
          "surface-container-low": "#f2f3f7",
          "secondary-fixed-dim": "#e9c400",
          "on-secondary-fixed": "#221b00",
          "outline": "#757686",
          "on-primary-fixed-variant": "#1e32bd",
          "surface-container-highest": "#e1e2e6",
          "outline-variant": "#c5c5d7",
          "on-tertiary-fixed-variant": "#44474a",
          "on-error-container": "#93000a",
          "secondary-container": "#fcd400",
          "surface-container": "#eceef2",
          "surface-bright": "#f8f9fd",
          "error-container": "#ffdad6",
          "tertiary-fixed-dim": "#c5c6ca",
          "surface-container-high": "#e7e8ec",
          "on-secondary-fixed-variant": "#544600",
          "surface-dim": "#d8dade",
          "on-secondary": "#ffffff",
          "inverse-on-surface": "#eff1f4",
          "surface-tint": "#3c4ed5",
          "on-secondary-container": "#6e5c00",
          "on-primary-fixed": "#000b62",
          "tertiary-container": "#35383b"
        },
        fontFamily: { "headline": ["Space Grotesk"], "body": ["Inter"], "label": ["Inter"] },
        borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
      },
    },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .glass-overlay { background: rgba(25, 28, 31, 0.4); backdrop-filter: blur(8px); }
  .whisper-shadow { box-shadow: 0 12px 32px -4px rgba(25, 28, 31, 0.06); }
</style>
</head>
<body class="bg-surface font-body text-on-surface flex min-h-screen">

<!-- ── Modal ──────────────────────────────────────────────────────────────── -->
<div id="uploadModal" class="fixed inset-0 z-50 glass-overlay flex items-center justify-center p-4">
  <div class="bg-surface-container-lowest w-full max-w-xl rounded-xl whisper-shadow border border-outline-variant/20 overflow-hidden flex flex-col">

    <!-- Header -->
    <div class="p-8 pb-4 flex justify-between items-start">
      <div class="space-y-1">
        <h2 class="text-2xl font-headline font-bold text-primary">Upload Incident Data</h2>
        <p class="text-on-surface-variant text-sm">Select or drag technical log files for automated curation.</p>
      </div>
      <button id="closeModal" class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors cursor-pointer">close</button>
    </div>

    <!-- Body -->
    <div class="p-8 space-y-8">
      <!-- Drop Zone -->
      <div id="dropZone" class="group relative flex flex-col items-center justify-center py-16 px-6 bg-surface-container-low border-2 border-dashed border-outline-variant/30 rounded-xl transition-all hover:bg-secondary-container/5 hover:border-primary-container">

          <div class="cursor-pointer w-full h-full flex flex-col items-center justify-center">
            
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 whisper-shadow">
              <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings:'FILL' 1;">description</span>
            </div>

            <div class="text-center space-y-2">
              <p class="font-headline font-semibold text-on-surface">
                Drag & Drop or Click to Upload
              </p>
              <p class="text-xs text-on-surface-variant font-label">
                .csv or .xlsx • Max 50MB
              </p>
            </div>

          </div>

          
      </div>
      <input id="incidentFileInput" type="file" accept=".csv,.xlsx" class="hidden"/>

      <!-- Progress -->
      <div class="space-y-3">
        <div class="flex justify-between items-end">
          <span class="text-[10px] uppercase tracking-widest font-label font-bold text-on-surface-variant">Upload Progress</span>
          <span id="uploadStatus" class="text-xs font-medium text-on-surface-variant italic">Waiting for file…</span>
        </div>
        <div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
          <div id="uploadProgress" class="h-full w-0 bg-gradient-to-r from-primary to-primary-container rounded-full transition-all duration-500"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-8 py-6 bg-surface-container-low flex justify-end items-center gap-4">
      <button id="cancelUpload" class="px-5 py-2.5 text-sm font-medium text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
        Cancel
      </button>
      <button id="startUploadBtn" class="px-8 py-2.5 bg-primary/40 text-on-primary/60 text-sm font-bold rounded-lg flex items-center gap-2 cursor-not-allowed opacity-50" disabled>
        <span class="material-symbols-outlined text-sm">play_arrow</span>Start Upload
      </button>
    </div>

  </div>
</div>
<script src="assets/scripts/file_upload.js"></script>

</body></html>
